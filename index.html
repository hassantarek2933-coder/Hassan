<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة بسيطة</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#0b1220;color:#edf2ff;
  font-family:Arial,Tahoma,sans-serif;
  min-height:100vh;display:flex;
  justify-content:center;align-items:center;padding:12px
}
.app{
  width:100%;max-width:700px;height:85vh;min-height:450px;
  display:flex;flex-direction:column;overflow:hidden;
  background:#111c2e;border:1px solid #26364d;border-radius:18px
}
header{padding:18px;border-bottom:1px solid #26364d}
h2{margin:0 0 7px;font-size:21px}
#status{font-size:13px;color:#fbbf24}
#messages{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px
}
.msg{
  background:#202f49;padding:12px 14px;border-radius:14px;
  max-width:85%;overflow-wrap:anywhere;align-self:flex-start
}
.msg.mine{background:#344d91;align-self:flex-end}
.meta{font-size:12px;color:#bdcbea;margin-bottom:6px}
.body{white-space:pre-wrap;line-height:1.6}
form{
  display:flex;gap:8px;padding:12px;
  border-top:1px solid #26364d
}
input{
  min-width:0;width:100%;padding:12px;
  background:#19263b;color:white;border:1px solid #30425e;
  border-radius:10px;font-size:14px
}
#name{max-width:110px}
button{
  border:0;border-radius:10px;background:#6d8cff;
  color:white;padding:0 16px;font-weight:bold
}
button:disabled{opacity:.5}
#notice{padding:8px 14px;color:#fbbf24;font-size:12px}
@media(max-width:480px){
  .app{height:90vh}
  form{gap:5px;padding:8px}
  #name{max-width:85px}
  button{padding:0 10px}
}
</style>
</head>

<body>
<div class="app">
  <header>
    <h2>💬 دردشة بسيطة</h2>
    <div id="status">جارٍ الاتصال بفايربيس...</div>
  </header>

  <div id="notice"></div>

  <div id="messages">
    <p>أهلاً بيك 👋 جاري تحميل الرسائل...</p>
  </div>

  <form id="chatForm">
    <input id="name" placeholder="اسمك" maxlength="24" required>
    <input id="message" placeholder="اكتب رسالة..." maxlength="1000" required>
    <button id="sendBtn" type="submit" disabled>إرسال</button>
  </form>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  limit,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCXoZgWi5P5E9sva61AKcLtG56R039Ina8",
  authDomain: "el-zezo.firebaseapp.com",
  projectId: "el-zezo",
  storageBucket: "el-zezo.firebasestorage.app",
  messagingSenderId: "184946115201",
  appId: "1:184946115201:web:5e947f52c52b9bf6dd0380",
  measurementId: "G-28SK64WR6B"
};

const statusEl = document.getElementById("status");
const notice = document.getElementById("notice");
const messagesEl = document.getElementById("messages");
const form = document.getElementById("chatForm");
const nameEl = document.getElementById("name");
const messageEl = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

let senderId = sessionStorage.getItem("chatSenderId");

if (!senderId) {
  senderId = crypto.randomUUID();
  sessionStorage.setItem("chatSenderId", senderId);
}

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // اسم المجموعة مطابق لقواعد Firestore
  const messagesRef = collection(db, "messages");

  const q = query(
    messagesRef,
    orderBy("createdAt", "asc"),
    limit(200)
  );

  onSnapshot(q, (snapshot) => {
    messagesEl.replaceChildren();

    if (snapshot.empty) {
      messagesEl.textContent =
        "لسه مفيش رسائل. ابدأ المحادثة 👋";
    }

    snapshot.forEach((doc) => {
      const data = doc.data();

      const item = document.createElement("div");
      item.className = "msg" +
        (data.senderId === senderId ? " mine" : "");

      const meta = document.createElement("div");
      meta.className = "meta";

      const time = data.createdAt?.toDate
        ? data.createdAt.toDate().toLocaleTimeString("ar-EG", {
            hour: "2-digit",
            minute: "2-digit"
          })
        : "الآن";

      meta.textContent =
        (data.name || "مستخدم") + " • " + time;

      const body = document.createElement("div");
      body.className = "body";
      body.textContent = data.text || "";

      item.append(meta, body);
      messagesEl.appendChild(item);
    });

    messagesEl.scrollTop = messagesEl.scrollHeight;

    statusEl.textContent = "متصل بفايربيس ✓";
    statusEl.style.color = "#86efac";
    sendBtn.disabled = false;
    notice.textContent = "";

  }, (error) => {
    console.error("Firestore read error:", error);

    statusEl.textContent = "فشل تحميل الرسائل";
    notice.textContent =
      "خطأ: " + error.code +
      " — راجع قواعد Firestore واتصال الإنترنت.";

    sendBtn.disabled = true;
  });

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = nameEl.value.trim();
    const text = messageEl.value.trim();

    if (!name || !text) return;

    sendBtn.disabled = true;

    try {
      await addDoc(messagesRef, {
        name: name,
        text: text,
        senderId: senderId,
        createdAt: serverTimestamp()
      });

      messageEl.value = "";
      messageEl.focus();

    } catch (error) {
      console.error("Firestore write error:", error);

      alert("فشل إرسال الرسالة: " + error.code);

    } finally {
      sendBtn.disabled = false;
    }
  });

} catch (error) {
  console.error("Firebase initialization error:", error);

  statusEl.textContent = "خطأ في تشغيل Firebase";
  notice.textContent = error.message;
}
</script>
</body>
</html>
