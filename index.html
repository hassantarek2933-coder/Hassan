<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دردشة بسيطة</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1220; --panel:#111c2e; --line:#26364d; --accent:#6d8cff; --text:#edf2ff; --muted:#9aabc4; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:linear-gradient(145deg,#0b1220,#101b31); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; display:flex; justify-content:center; align-items:center; padding:18px; }
    .app { width:min(760px,100%); height:min(820px,92vh); min-height:540px; display:flex; flex-direction:column; overflow:hidden; background:rgba(17,28,46,.96); border:1px solid var(--line); border-radius:22px; box-shadow:0 24px 70px #0005; }
    header { padding:20px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:13px; }
    .logo { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; background:#24345b; font-size:23px; }
    h1 { margin:0; font-size:20px; } .sub { color:var(--muted); font-size:13px; margin-top:4px; }
    .status { margin-right:auto; color:#9ce6bc; font-size:12px; white-space:nowrap; }
    .setup { padding:12px 18px; background:#192743; border-bottom:1px solid var(--line); font-size:13px; color:#d5e1ff; line-height:1.7; }
    .setup code { direction:ltr; display:inline-block; color:#b9c9ff; }
    .messages { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:13px; }
    .empty { margin:auto; text-align:center; color:var(--muted); line-height:1.9; }
    .msg { max-width:82%; align-self:flex-start; background:#202f49; padding:11px 14px; border-radius:16px 16px 16px 5px; overflow-wrap:anywhere; }
    .msg.mine { align-self:flex-end; background:#344d91; border-radius:16px 16px 5px 16px; }
    .meta { display:flex; gap:10px; align-items:center; margin-bottom:5px; font-size:11px; color:#b9c8e0; }
    .body { white-space:pre-wrap; line-height:1.6; }
    form { border-top:1px solid var(--line); padding:15px; display:flex; gap:10px; background:#0e1829; }
    input { min-width:0; background:#19263b; border:1px solid #30425e; color:var(--text); border-radius:13px; padding:13px 14px; font:inherit; outline:none; }
    input:focus { border-color:var(--accent); }
    #name { width:120px; } #message { flex:1; }
    button { border:0; border-radius:13px; background:var(--accent); color:white; padding:0 20px; font:inherit; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .hint { padding:0 18px 12px; color:var(--muted); font-size:11px; }
    @media(max-width:520px) { body{padding:0} .app{height:100vh;min-height:0;border-radius:0;border:0} header{padding:16px} .messages{padding:15px} form{padding:10px;gap:7px} #name{width:88px;padding:11px 8px} #message{padding:11px 10px} button{padding:0 14px} .status{display:none} }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">💬</div>
      <div><h1>دردشة بسيطة</h1><div class="sub">محادثة مباشرة للجميع</div></div>
      <div class="status" id="status">جارٍ الاتصال…</div>
    </header>
    <div class="setup" id="setupNotice">
      قبل التشغيل: ضع بيانات مشروع Firebase في متغير <code>firebaseConfig</code> داخل الملف، وفعّل Firestore Database.
    </div>
    <section class="messages" id="messages" aria-live="polite">
      <div class="empty">أهلًا بيك 👋<br>الرسائل هتظهر هنا أول ما تربط Firebase.</div>
    </section>
    <div class="hint">اكتب اسمك ورسالتك، ثم اضغط إرسال.</div>
    <form id="chatForm">
      <input id="name" maxlength="24" placeholder="اسمك" aria-label="اسمك" required />
      <input id="message" maxlength="1000" placeholder="اكتب رسالة…" aria-label="الرسالة" autocomplete="off" required />
      <button id="sendBtn" type="submit" disabled>إرسال</button>
    </form>
  </main>

  <script type="module">
    // 1) استبدل القيم التالية ببيانات مشروعك من Firebase Console > Project settings > Your apps.
    const firebaseConfig = {
      apiKey: "AIzaSyCXoZgWi5P5E9sva61AKcLtG56R039Ina8",
      authDomain: "el-zezo.firebaseapp.com",
      projectId: "el-zezo",
      storageBucket: "el-zezo.firebasestorage.app",
      messagingSenderId: "184946115201",
      appId: "1:184946115201:web:5e947f52c52b9bf6dd0380"
      measurementId: "G-28SK64WR6B"
    };

    const setupNotice = document.getElementById("setupNotice");
    const messagesEl = document.getElementById("messages");
    const statusEl = document.getElementById("status");
    const nameEl = document.getElementById("name");
    const messageEl = document.getElementById("message");
    const sendBtn = document.getElementById("sendBtn");
    const form = document.getElementById("chatForm");

    const configured = firebaseConfig.apiKey !== "YOUR_API_KEY" &&
      firebaseConfig.projectId !== "YOUR_PROJECT_ID" &&
      firebaseConfig.appId !== "YOUR_APP_ID";

    if (!configured) {
      statusEl.textContent = "بانتظار الإعداد";
      form.addEventListener("submit", e => {
        e.preventDefault();
        alert("اربط الموقع بمشروع Firebase أولًا عن طريق تعديل firebaseConfig داخل index.html.");
      });
    } else {
      try {
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js");
        const { getFirestore, collection, addDoc, query, orderBy, limit, onSnapshot, serverTimestamp } =
          await import("https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js");

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const messagesRef = collection(db, "messages");
        const q = query(messagesRef, orderBy("createdAt", "asc"), limit(200));

        setupNotice.style.display = "none";
        statusEl.textContent = "متصل";
        sendBtn.disabled = false;

        onSnapshot(q, snapshot => {
          messagesEl.replaceChildren();
          if (snapshot.empty) {
            const empty = document.createElement("div");
            empty.className = "empty";
            empty.textContent = "لسه مفيش رسائل. ابدأ المحادثة 👋";
            messagesEl.append(empty);
            return;
          }
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            const wrap = document.createElement("article");
            wrap.className = "msg" + (data.senderId === getSenderId() ? " mine" : "");
            const meta = document.createElement("div");
            meta.className = "meta";
            const sender = document.createElement("span");
            sender.textContent = data.name || "مستخدم";
            const time = document.createElement("span");
            time.textContent = data.createdAt?.toDate
              ? data.createdAt.toDate().toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit" })
              : "الآن";
            meta.append(sender, time);
            const body = document.createElement("div");
            body.className = "body";
            body.textContent = data.text || "";
            wrap.append(meta, body);
            messagesEl.append(wrap);
          });
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }, error => {
          statusEl.textContent = "خطأ في الاتصال";
          console.error(error);
          setupNotice.style.display = "block";
          setupNotice.textContent = "تعذّر تحميل الرسائل. تأكد من إعداد Firestore وقواعد الأمان واتصال الإنترنت.";
        });

        form.addEventListener("submit", async e => {
          e.preventDefault();
          const name = nameEl.value.trim();
          const text = messageEl.value.trim();
          if (!name || !text) return;
          sendBtn.disabled = true;
          try {
            await addDoc(messagesRef, {
              name,
              text,
              senderId: getSenderId(),
              createdAt: serverTimestamp()
            });
            messageEl.value = "";
            messageEl.focus();
          } catch (error) {
            console.error(error);
            alert("لم يتم إرسال الرسالة. راجع قواعد Firestore في Firebase Console.");
          } finally {
            sendBtn.disabled = false;
          }
        });
      } catch (error) {
        console.error(error);
        statusEl.textContent = "تعذّر التشغيل";
        setupNotice.style.display = "block";
        setupNotice.textContent = "حصل خطأ في تحميل Firebase. راجع بيانات المشروع وشغّل الموقع عبر استضافة أو خادم محلي، وليس بفتح الملف مباشرة إن واجهت مشكلة.";
      }
    }

    function getSenderId() {
      let id = sessionStorage.getItem("simpleChatSenderId");
      if (!id) {
        id = crypto.randomUUID();
        sessionStorage.setItem("simpleChatSenderId", id);
      }
      return id;
    }
  </script>
</body>
</html>
